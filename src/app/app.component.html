<h1>Else If Condition | Control flow Statement</h1>
<ul>
  <li>Define HTML elements and property</li>
  <li>Apply basic if condition</li>
  <li>Apply else if condition</li>
  <li>Interview Question</li>
</ul>

<hr>

<button (click)="handleClick(1)">Red</button>
<button (click)="handleClick(2)">Green</button>
<button (click)="handleClick(3)">Blue</button>
<button (click)="handleClick(4)">Other</button>

<input type="text" placeholder="Enter color number" (input)="handleInput($event)">

@if(color==1){
<div style="background-color: red; width: 100px; height: 100px;"></div>
} @else if (color==2) {
<div style="background-color: green; width: 100px; height: 100px;"></div>
} @else if (color==3) {
<div style="background-color: blue; width: 100px; height: 100px;"></div>
} @else {
<div style="background-color: black; width: 100px; height: 100px;"></div>
}
